plugins {
	id 'java-library'
	id 'maven-publish'

//	id 'org.springframework.boot' version '4.1.2'
}

group = 'dev.ductlm.starter'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

repositories {
	mavenCentral()
}

dependencies {
	//expose
	api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
	api 'org.springframework.boot:spring-boot-starter-security'

	//internal
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}


publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			pom {
				name = 'self-libraries'
				url = 'https://github.com/vductlm/self-libraries'
			}
		}
	}
	repositories {
		maven {
			name = 'GitHubPackages'
			url = uri('https://maven.pkg.github.com/vductlm/self-libraries')
			credentials {
				username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
				password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
			}
		}
	}
}
